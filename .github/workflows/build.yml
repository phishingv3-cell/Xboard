name: Build XBoard Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Find Project Subfolder or Root
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "XBoardSinhalaKeyboard/gradlew" ]; then
            echo "PROJECT_DIR=XBoardSinhalaKeyboard" >> $GITHUB_ENV
          else
            DIR=$(dirname $(find . -name "build.gradle.kts" -not -path "*/app/*" | head -n 1))
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Setup Gradle Wrapper if Missing
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XBoard-Sinhala-Keyboard-Debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
